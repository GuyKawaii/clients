<ng-template>
  <bit-popover-base [accessibleName]="title()">
    <ng-content select="bit-popover-header"></ng-content>
    <div [class]="styles.padding">
      <div [class]="styles.closePosition">
        <button
          type="button"
          bitIconButton="bwi-close"
          [buttonType]="closeButtonType()"
          [label]="'close' | i18n"
          (click)="closed.emit()"
          size="small"
        ></button>
      </div>
      <div [class]="styles.content">
        <div [class]="styles.headingAndBody">
          <h2 bitTypography="h4" [class]="titleClasses()">
            {{ title() }}
          </h2>
          <div bitTypography="body2" [class]="styles.description">
            <ng-content></ng-content>
          </div>
        </div>
        <ng-content select="bit-popover-footer"></ng-content>
      </div>
    </div>
  </bit-popover-base>
</ng-template>
